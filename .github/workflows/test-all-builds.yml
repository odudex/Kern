name: Test All Builds
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        # *_v3: ESP32-P4 chip revision v3.x (sdkconfig.rev3); IDF cannot
        # build one image for both v1.x and v3.x silicon.
        board: [wave_4b, wave_35, wave_5, wave_43, crowpanel, wave_7b,
                wave_4b_v3, wave_35_v3, wave_5_v3, wave_43_v3, crowpanel_v3, wave_7b_v3]
    name: build (${{ matrix.board }})
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Build (${{ matrix.board }})
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        . $IDF_PATH/export.sh
        BOARD=${{ matrix.board }}
        DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.${BOARD%_v3}"
        [ "$BOARD" = "${BOARD%_v3}" ] || DEFAULTS="$DEFAULTS;sdkconfig.rev3"
        idf.py -B build_$BOARD \
               -D SDKCONFIG=build_$BOARD/sdkconfig \
               -D "SDKCONFIG_DEFAULTS=$DEFAULTS" \
               build all size-components size
    - name: Stage flashable firmware (${{ matrix.board }})
      run: |
        STAGE="firmware_${{ matrix.board }}"
        BUILD="build_${{ matrix.board }}"
        mkdir -p "$STAGE"
        cp "$BUILD"/bootloader/bootloader.bin "$STAGE"/
        cp "$BUILD"/partition_table/partition-table.bin "$STAGE"/
        cp "$BUILD"/flasher_args.json "$STAGE"/
        cp "$BUILD"/*.bin "$STAGE"/ 2>/dev/null || true
        cp "$BUILD"/flash_args "$STAGE"/ 2>/dev/null || true
        # The bundle is flat: strip the build-tree subdirectories so
        # `esptool write-flash $(cat flash_args)` resolves from the zip root
        sed -i 's#bootloader/bootloader.bin#bootloader.bin#; s#partition_table/partition-table.bin#partition-table.bin#' \
            "$STAGE"/flash_args "$STAGE"/flasher_args.json
        cp "$BUILD"/*.elf "$STAGE"/ 2>/dev/null || true
        cp "$BUILD"/*.map "$STAGE"/ 2>/dev/null || true
    - name: Upload firmware artifact (${{ matrix.board }})
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.board }}
        path: firmware_${{ matrix.board }}/
        if-no-files-found: error
        retention-days: 30


  deploy-site:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout site sources
      uses: actions/checkout@v4
    - name: Download firmware
      uses: actions/download-artifact@v4.1.3
      with:
        pattern: firmware-*
        path: site/flash/firmware
    - name: Name firmware folders by board
      run: |
        for d in site/flash/firmware/firmware-*; do
          mv "$d" "site/flash/firmware/${d##*/firmware-}"
        done
    - name: Stage branding assets
      run: cp -r branding site/branding
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/
        name: github-pages-${{ github.run_attempt }}
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: github-pages-${{ github.run_attempt }}
