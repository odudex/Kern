[package]
name = "kern-bip377"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
bip377-ll = { path = "upstream/bip377-ll", default-features = false, features = ["ffi"] }
bip-nonces-cache-ll = { path = "../bip_nonces_cache/upstream/bip-nonces-cache-ll", features = ["ffi"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
